<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Radio Cast Receiver 4K</title>
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="state-idle">
    <video class="castMediaElement" id="castMediaElement" playsinline></video>

    <div id="ambientBackdrop" class="ambient-backdrop">
        <div id="ambientArtwork" class="ambient-artwork"></div>
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
        <div class="ambient-overlay"></div>
    </div>

    <main id="tvStage" class="tv-stage">
        <header class="top-bar">
            <div class="brand-badge">
                <span class="live-dot" id="liveDot"></span>
                <span class="brand-title">T-RADIO</span>
                <span class="stream-badge" id="streamBadge">LIVE • 4K</span>
            </div>
            <div class="clock-widget">
                <div class="clock-time" id="clockTime">--:--</div>
                <div class="clock-date" id="clockDate">---</div>
            </div>
        </header>

        <div class="content-grid">
            <div class="player-card">
                <div class="artwork-wrapper">
                    <div class="artwork-glow" id="artworkGlow"></div>
                    <img id="stationLogo" class="station-logo" src="" alt="Station Logo" crossorigin="anonymous">
                    <div id="logoFallback" class="logo-fallback">
                        <svg viewBox="0 0 24 24" width="80" height="80" fill="currentColor">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                        </svg>
                    </div>
                </div>

                <div class="track-details">
                    <div class="station-header">
                        <span class="station-pill" id="stationPill">SENDER</span>
                        <h2 id="stationName" class="station-name">T-Radio</h2>
                    </div>

                    <div class="song-meta" id="songMetaContainer">
                        <h1 id="songTitle" class="song-title">Bereit zur Wiedergabe</h1>
                        <p id="songArtist" class="song-artist">Wählen Sie einen Sender auf Ihrem Smartphone</p>
                    </div>

                    <div class="visualizer-container">
                        <canvas id="visualizerCanvas" width="700" height="80"></canvas>
                    </div>
                </div>
            </div>

            <aside id="historyPanel" class="history-panel">
                <div class="history-header">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
                    </svg>
                    <span>Zuletzt gespielt</span>
                </div>
                <ul id="historyList" class="history-list">
                    <li class="history-empty">Keine vorherigen Titel</li>
                </ul>
            </aside>
        </div>

        <div id="standbyScreen" class="standby-screen">
            <div class="standby-content">
                <div class="standby-icon">
                    <svg viewBox="0 0 24 24" width="64" height="64" fill="currentColor">
                        <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/>
                    </svg>
                </div>
                <div class="standby-logo">T-RADIO</div>
                <div class="standby-clock" id="standbyClock">--:--</div>
                <div class="standby-hint">Bereit zum Casten über die T-Radio App</div>
            </div>
        </div>
    </main>

    <script src="receiver.js"></script>
</body>
</html>
